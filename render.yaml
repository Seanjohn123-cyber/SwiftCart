services:
  - type: web
    name: swiftcart-agent-shopper
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NEXT_PUBLIC_PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: MERCHANT_IMPORT_TOKEN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: PAYPAL_API_BASE
        value: https://api-m.sandbox.paypal.com
      - key: APP_BASE_URL
        value: https://swiftcart-agent-shopper.onrender.com
